name: Build VantoPay iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Signed iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Flutter project
        run: |
          cd /tmp
          flutter create vantopay_ios --project-name vantopay --org com.veexdevs --platforms ios

      - name: Overlay custom code
        run: |
          rm -rf /tmp/vantopay_ios/lib /tmp/vantopay_ios/assets
          cp -r flutter_app/lib /tmp/vantopay_ios/lib
          cp -r flutter_app/assets /tmp/vantopay_ios/assets
          cp flutter_app/pubspec.yaml /tmp/vantopay_ios/pubspec.yaml

      - name: Flutter pub get
        run: cd /tmp/vantopay_ios && flutter pub get

      - name: Prepare signing certificate & keychain
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=ios-build.keychain
          rm -f "$KEYCHAIN"
          security create-keychain -p "" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > ios_distribution.p12
          security import ios_distribution.p12 \
            -k "$KEYCHAIN" -P "" \
            -T /usr/bin/codesign
          security list-keychains -s "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > /tmp/vantopay_ios/ios/Runner.mobileprovision
          mkdir -p /tmp/vantopay_ios/ios/Profiles
          cp /tmp/vantopay_ios/ios/Runner.mobileprovision /tmp/vantopay_ios/ios/Profiles/

      - name: Archive with xcodebuild
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          cd /tmp/vantopay_ios/ios
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>release</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_DEVELOPMENT_TEAM }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.veexdevs.vantopay</key>
              <string>Runner.mobileprovision</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VantoPay.xcarchive \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        run: |
          cd /tmp/vantopay_ios/ios
          xcodebuild -exportArchive \
            -archivePath build/VantoPay.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates
          cp build/ipa/VantoPay.ipa /tmp/VantoPay-ios.ipa
          ls -lh /tmp/VantoPay-ios.ipa

      - name: Create Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ github.run_number }}
          name: VantoPay iOS v${{ github.run_number }}
          files: /tmp/VantoPay-ios.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
