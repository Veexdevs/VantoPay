name: Build VantoPay APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        env:
          CI: 'true'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          CI: 'true'

      - name: Find APK
        run: |
          mkdir -p /tmp/apk-output
          find . -name "*.apk" -type f -exec cp {} /tmp/apk-output/ \;
          ls -la /tmp/apk-output/

      - name: Upload APK as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: /tmp/apk-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Commit APK to repo
        if: always()
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          mkdir -p releases
          cp /tmp/apk-output/*.apk releases/ 2>/dev/null || true
          if ls releases/*.apk 1>/dev/null 2>&1; then
            git add releases/
            git commit -m "release: APK build #${{ github.run_number }}" || echo "nothing to commit"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantoPay v${{ github.run_number }}
          files: /tmp/apk-output/*.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
