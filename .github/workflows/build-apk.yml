name: Build VantoPay APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        env:
          CI: 'true'

      - name: List prebuild output
        run: |
          echo "=== android directory ==="
          ls -la android/ 2>/dev/null || echo "no android dir"
          echo "=== android/app directory ==="
          ls -la android/app/ 2>/dev/null || echo "no android/app dir"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          echo "=== Starting Gradle build ==="
          ./gradlew assembleDebug --no-daemon 2>&1
          echo "=== Build exit code: $? ==="
          echo "=== Searching all APKs ==="
          find . -name "*.apk" 2>/dev/null
          echo "=== APK output dirs ==="
          find . -type d -name "apk" 2>/dev/null
          find . -type d -name "outputs" 2>/dev/null

      - name: Collect APKs
        run: |
          mkdir -p /tmp/apk-output
          find . -name "*.apk" -exec cp {} /tmp/apk-output/ \;
          echo "=== APKs found ==="
          ls -la /tmp/apk-output/ 2>/dev/null || echo "NO APKs found anywhere"
          echo "=== All build outputs ==="
          find android/app/build -type f 2>/dev/null | head -30

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: /tmp/apk-output/*.apk
          retention-days: 30
          if-no-files-found: error
