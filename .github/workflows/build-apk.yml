name: Build VantoPay APK

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'app/**'
      - 'components/**'
      - 'package.json'
      - 'app.json'
      - 'eas.json'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'package.json'
      - 'app.json'
      - 'eas.json'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: |
          npm ci
          npm install

      - name: Configure EAS
        run: |
          eas init --id vantopay --force 2>/dev/null || true
          echo '{"cli":{"version":">= 14.4.1"},"build":{"preview":{"android":{"buildType":"apk"},"distribution":"internal"},"production":{"autoIncrement":true}}}' > eas.json

      - name: Build APK with EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        if: ${{ env.EXPO_TOKEN != '' }}
        run: eas build --profile preview --platform android --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (fallback - local)
        if: ${{ env.EXPO_TOKEN == '' }}
        run: |
          echo "️ EXPO_TOKEN not set. Building with Expo locally..."
          npx expo prebuild --platform android --clean
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease
        env:
          EXPO_TOKEN: ""

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            *.apk
          retention-days: 14

      - name: Create Release (on main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantoPay v${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            *.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-test:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint
