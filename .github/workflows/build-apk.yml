name: Build VantoPay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build APK
        run: |
          cd flutter_app
          flutter build apk --release --no-tree-shake-icons
          echo "=== Build complete ==="
          find . -name "*.apk" -type f 2>/dev/null

      - name: List build outputs
        run: |
          echo "=== APK files found ==="
          find flutter_app/build -name "*.apk" 2>/dev/null || echo "No APK in flutter_app/build"
          ls -lh flutter_app/build/app/outputs/flutter-apk/ 2>/dev/null || echo "No flutter-apk dir"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: |
            flutter_app/build/app/outputs/flutter-apk/*.apk
            flutter_app/build/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantoPay v${{ github.run_number }}
          files: |
            flutter_app/build/app/outputs/flutter-apk/*.apk
            flutter_app/build/**/*.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
