name: Build VantoPay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter project
        run: |
          cd /tmp
          flutter create vantopay_full --project-name vantopay --org com.veexdevs --platforms android

      - name: Overlay custom code
        run: |
          rm -rf /tmp/vantopay_full/lib
          cp -r flutter_app/lib /tmp/vantopay_full/lib
          cp flutter_app/pubspec.yaml /tmp/vantopay_full/pubspec.yaml

      - name: Flutter pub get
        run: |
          cd /tmp/vantopay_full
          flutter pub get

      - name: Build APK (with verbose output)
        run: |
          cd /tmp/vantopay_full
          flutter build apk --release --no-tree-shake-icons -v 2>&1 | tee build_output.log
          echo "EXIT CODE: $?"

      - name: Find APK
        if: always()
        run: |
          echo "=== Looking for APK files ==="
          find /tmp/vantopay_full/build -name "*.apk" 2>/dev/null || echo "No APK found in build/"
          find /tmp/vantopay_full -name "*.apk" 2>/dev/null || echo "No APK found anywhere"
          echo "=== Build directory structure ==="
          find /tmp/vantopay_full/build -type f 2>/dev/null | head -50 || echo "No build directory"

      - name: Upload APK to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantoPay v${{ github.run_number }}
          files: /tmp/vantopay_full/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
