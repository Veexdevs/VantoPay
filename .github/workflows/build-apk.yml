name: Build VantoPay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: |
          flutter doctor -v
          cd flutter_app
          flutter pub get

      - name: Build APK with verbose
        id: build
        run: |
          cd flutter_app
          flutter build apk --release --verbose 2>&1 | tee /tmp/build.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Show build log tail
        if: always()
        run: |
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -100 /tmp/build.log 2>/dev/null || echo "No build log"
          echo "=== APK files ==="
          find /home/runner -name "*.apk" 2>/dev/null | head -20 || echo "No APK found"
          echo "=== Flutter build dir ==="
          ls -la flutter_app/build/ 2>/dev/null || echo "No build dir"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: |
            flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 30
