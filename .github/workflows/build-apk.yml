name: Build VantoPay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter project structure
        run: |
          # Save our custom lib and assets
          cp -r flutter_app/lib /tmp/lib_backup
          cp -r flutter_app/assets /tmp/assets_backup 2>/dev/null || true
          cp flutter_app/pubspec.yaml /tmp/pubspec_backup.yaml
          
          # Create full Flutter project
          cd /tmp
          flutter create vantopay_project --project-name vantopay --org com.veexdevs
          
          # Copy our code into the project
          rm -rf /tmp/vantopay_project/lib
          cp -r /tmp/lib_backup /tmp/vantopay_project/lib
          cp /tmp/pubspec_backup.yaml /tmp/vantopay_project/pubspec.yaml
          if [ -d /tmp/assets_backup ]; then
            cp -r /tmp/assets_backup /tmp/vantopay_project/assets
          fi
          
          # Copy to repo
          rm -rf flutter_app
          cp -r /tmp/vantopay_project flutter_app

      - name: Install dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build APK
        run: |
          cd flutter_app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantoPay v${{ github.run_number }}
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
