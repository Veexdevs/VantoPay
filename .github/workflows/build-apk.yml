name: Build VantoPay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter project
        run: |
          cd /tmp
          flutter create vantopay_project --project-name vantopay --org com.veexdevs
          echo "=== Project created ==="
          ls -la vantopay_project/
          
          # Backup our code
          cp -r /home/runner/work/VantoPay/VantoPay/flutter_app/lib /tmp/vantopay_project/lib
          cp /home/runner/work/VantoPay/VantoPay/flutter_app/pubspec.yaml /tmp/vantopay_project/pubspec.yaml
          
          # Replace in repo
          rm -rf /home/runner/work/VantoPay/VantoPay/flutter_app
          cp -r /tmp/vantopay_project /home/runner/work/VantoPay/VantoPay/flutter_app
          
          echo "=== Final structure ==="
          ls -la /home/runner/work/VantoPay/VantoPay/flutter_app/
          ls -la /home/runner/work/VantoPay/VantoPay/flutter_app/android/

      - name: Install dependencies
        run: cd flutter_app && flutter pub get

      - name: Build APK
        run: cd flutter_app && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantoPay v${{ github.run_number }}
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
