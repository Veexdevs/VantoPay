name: Build VantoPay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Flutter project
        run: |
          cd /tmp
          flutter create vantopay_full --project-name vantopay --org com.veexdevs --platforms android

      - name: Overlay custom code
        run: |
          rm -rf /tmp/vantopay_full/lib
          rm -rf /tmp/vantopay_full/assets
          cp -r flutter_app/lib /tmp/vantopay_full/lib
          cp -r flutter_app/assets /tmp/vantopay_full/assets
          cp flutter_app/pubspec.yaml /tmp/vantopay_full/pubspec.yaml

      - name: Flutter pub get
        run: |
          cd /tmp/vantopay_full
          flutter pub get

      - name: Build APK
        run: |
          cd /tmp/vantopay_full
          flutter build apk --release --no-tree-shake-icons 2>&1
          echo "=== APK files ==="
          find /tmp/vantopay_full/build -name "*.apk" -type f 2>/dev/null

      - name: Copy APK to workspace
        run: |
          APK=$(find /tmp/vantopay_full/build -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK found, looking for debug..."
            APK=$(find /tmp/vantopay_full/build -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          echo "APK: $APK"
          cp "$APK" ./VantoPay.apk
          ls -lh ./VantoPay.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantoPay v${{ github.run_number }}
          files: ./VantoPay.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
