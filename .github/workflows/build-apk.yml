name: Build VantoPay APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        env:
          CI: 'true'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          CI: 'true'

      - name: Package APK
        run: |
          mkdir -p releases
          APK=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            echo "Found APK: $APK ($(du -h $APK | cut -f1))"
            cp "$APK" releases/VantoPay.apk
            # Compress for git
            cd releases
            zip -9 VantoPay.zip VantoPay.apk
            ls -lh
          else
            echo "ERROR: No APK found!"
            find . -name "*.apk" -type f 2>/dev/null
            exit 1
          fi

      - name: Commit APK to repo
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add releases/
          git diff --cached --quiet || {
            git commit -m "release: APK v${{ github.run_number }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantoPay v${{ github.run_number }}
          files: releases/*.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: releases/*.apk
          retention-days: 30
