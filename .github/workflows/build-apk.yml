name: Build VantoPay APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prebuild Android
        id: prebuild
        run: |
          echo "=== Running expo prebuild ==="
          npx expo prebuild --platform android --clean 2>&1 | tee /tmp/prebuild.log
          PREBUILD_EXIT=${PIPESTATUS[0]}
          echo "prebuild_exit=$PREBUILD_EXIT" >> "$GITHUB_OUTPUT"
          echo "=== Prebuild exit: $PREBUILD_EXIT ==="
          echo "=== Android directory contents ==="
          ls -la android/ 2>/dev/null || echo "NO android directory!"
          ls -la android/app/ 2>/dev/null || echo "NO android/app directory!"
          ls -la android/app/build.gradle 2>/dev/null || echo "NO build.gradle!"
        env:
          CI: 'true'

      - name: Gradle Build
        id: gradle
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist!"
            exit 1
          fi
          cd android
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found!"
            ls -la
            exit 1
          fi
          chmod +x ./gradlew
          echo "=== Starting Gradle build ==="
          echo "=== Java version ==="
          java -version 2>&1
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          echo "=== SDK dir ==="
          ls $ANDROID_HOME 2>/dev/null || echo "no ANDROID_HOME dir"
          echo "=== Running assembleDebug ==="
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "gradle_exit=$GRADLE_EXIT" >> "$GITHUB_OUTPUT"
          echo "=== Gradle exit: $GRADLE_EXIT ==="
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "=== LAST 100 LINES OF GRADLE LOG ==="
            tail -100 /tmp/gradle.log
          fi
        env:
          CI: 'true'

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p /tmp/apk-output
          echo "=== Searching all APKs in entire filesystem ==="
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "Found: $apk"
            cp "$apk" /tmp/apk-output/
          done
          echo "=== APK output dir ==="
          ls -la /tmp/apk-output/ 2>/dev/null || echo "NO APKs found!"
          APK_COUNT=$(find /tmp/apk-output -name "*.apk" | wc -l)
          echo "apk_count=$APK_COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/prebuild.log
            /tmp/gradle.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload APK
        if: steps.collect.outputs.apk_count > 0
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: /tmp/apk-output/*.apk
          retention-days: 30
