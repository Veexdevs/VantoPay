name: Build VantoPay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter project with Android native files
        run: |
          cd /tmp
          flutter create vantopay_full --project-name vantopay --org com.veexdevs --platforms android
          echo "Project created"
          ls -la vantopay_full/
          ls -la vantopay_full/android/

      - name: Copy app code into Flutter project
        run: |
          # Remove default lib and assets
          rm -rf /tmp/vantopay_full/lib
          rm -rf /tmp/vantopay_full/assets
          
          # Copy our code
          cp -r flutter_app/lib /tmp/vantopay_full/lib
          cp -r flutter_app/assets /tmp/vantopay_full/assets
          cp flutter_app/pubspec.yaml /tmp/vantopay_full/pubspec.yaml
          
          echo "=== Files copied ==="
          ls -la /tmp/vantopay_full/lib/
          ls -la /tmp/vantopay_full/assets/

      - name: Install dependencies
        run: |
          cd /tmp/vantopay_full
          flutter pub get
          flutter doctor -v

      - name: Build APK
        run: |
          cd /tmp/vantopay_full
          flutter build apk --release --no-tree-shake-icons
          echo "=== Build complete ==="
          ls -lh build/app/outputs/flutter-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantoPay v${{ github.run_number }}
          files: /tmp/vantopay_full/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: /tmp/vantopay_full/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
