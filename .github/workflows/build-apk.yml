name: Build VantoPay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter project
        run: |
          cd /tmp
          flutter create vantopay_full --project-name vantopay --org com.veexdevs --platforms android

      - name: Overlay custom code
        run: |
          rm -rf /tmp/vantopay_full/lib
          cp -r flutter_app/lib /tmp/vantopay_full/lib
          cp flutter_app/pubspec.yaml /tmp/vantopay_full/pubspec.yaml

      - name: Flutter pub get
        run: |
          cd /tmp/vantopay_full
          flutter pub get

      - name: Build APK
        run: |
          cd /tmp/vantopay_full
          flutter build apk --release --no-tree-shake-icons

      - name: Locate and copy APK
        run: |
          echo "=== Searching for APK ==="
          find /tmp/vantopay_full/build -name "*.apk" -type f
          echo "=== Copying to workspace ==="
          # Find the release APK
          APK_PATH=$(find /tmp/vantopay_full/build -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found, looking for any APK..."
            APK_PATH=$(find /tmp/vantopay_full/build -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            find /tmp/vantopay_full/build -type f 2>/dev/null
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ./VantoPay.apk
          ls -lh ./VantoPay.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantoPay v${{ github.run_number }}
          files: ./VantoPay.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: ./VantoPay.apk
          retention-days: 30
