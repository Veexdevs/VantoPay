name: Build VantoPay APK (Flutter)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./flutter_app

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./flutter_app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VantoPay-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Commit APK to repo
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          mkdir -p releases
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk releases/VantoPay.apk
          cd releases
          zip -9 VantoPay.apk.zip VantoPay.apk
          rm VantoPay.apk
          cd ..
          git add -f releases/VantoPay.apk.zip
          git diff --cached --quiet || {
            git commit -m "release: VantoPay APK v${{ github.run_number }}"
            git push
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantoPay v${{ github.run_number }}
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
