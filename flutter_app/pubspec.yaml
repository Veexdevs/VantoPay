name: vantopay
description: Acesso seguro à sua conta VantoPay.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
  fonts:
    - family: VantoSans
      fonts:
        - asset: assets/fonts/Manrope.ttf
