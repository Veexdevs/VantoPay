publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  # Pinned to versions compatible with Flutter 3.24.x / Dart 3.5.
  supabase_flutter: 2.8.0
