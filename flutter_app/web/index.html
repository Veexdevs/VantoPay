<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Acesse sua conta VantoPay. Pagamentos mais simples. Sempre.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VantoPay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>VantoPay · Acesse sua conta</title>
  <style>
    /* Flutter owns scrolling. Prevent the browser document from keeping an
       off-screen scroll offset after the software keyboard is dismissed. */
    html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#000;color:#fff}
    body{position:fixed;inset:0}
    #loading{position:fixed;inset:0;display:grid;place-items:center;font:14px system-ui;letter-spacing:.08em}
    #loading span{animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
    @media(prefers-reduced-motion:reduce){#loading span{animation:none}}
  </style>
</head>
<body>
  <div id="loading" role="status"><span>Carregando VantoPay…</span></div>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());</script>
  <script>
    // Authentication must not run a stale offline bundle after a deployment.
    // Remove only Flutter's legacy worker/cache; never clear cookies or auth storage.
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            const worker = registration.active || registration.waiting || registration.installing;
            if (worker && new URL(worker.scriptURL).pathname.endsWith('/flutter_service_worker.js')) {
              await registration.unregister();
            }
          }
        }
        if ('caches' in window) {
          await Promise.all(['flutter-app-cache', 'flutter-temp-cache', 'flutter-app-manifest']
            .map(name => caches.delete(name)));
        }
      } catch (_) { /* Restricted storage must not prevent the app from starting. */ }
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
